[package]
name = "nixwatch-frames"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Streams the Gatus observability dashboard to nixlock's kiosk display socket"
homepage = "https://github.com/julian-corbet/nixwatch-corbet-ch"
publish = false

# The dashboard model+render are a [lib] so a future web build can reuse them without pulling
# in nixlock/wayland at all -- mirrors nixnet's lib-behind-thin-bins layout.
[lib]
name = "nixwatch"
path = "src/lib.rs"

[[bin]]
name = "nixwatch-frames"
path = "src/bin/nixwatch-frames.rs"

[dependencies]
# NO nixlock dependency. nixwatch-frames is a pure socket CLIENT of nixlock's kiosk display Unix
# socket (see nixlock's README "Streaming kiosk content" / BEHAVIORS.md DISPLAY-1/DISPLAY-2) --
# it speaks the wire protocol by hand (src/bin/nixwatch-frames.rs) and links no nixlock code, no
# Wayland, and no PAM. This is what lets this crate build with plain nix again: no git dependency,
# no outputHashes, no bindgen.

# CPU rendering: shapes (tiny-skia) + glyph rasterization (fontdue), the same stack nixlock uses
# for its own lock screen -- one Pixmap feeds both --dump PNG and the streamed kiosk frames.
tiny-skia = "0.11"
fontdue = "0.9"

# Gatus statuses API client + its JSON shape.
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Header clock/date formatting.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = 2
